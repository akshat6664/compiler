<!DOCTYPE html>
<html>
<head>
    <title>Code Transpiler IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

    <style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: white;
    }

    h1 {
        text-align: center;
        padding: 15px;
        margin: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        color: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
    }

    select {
        background: #1e293b;
        color: white;
        padding: 8px;
        border-radius: 6px;
        border: none;
    }

    button {
        background: linear-gradient(45deg, #0ea5e9, #38bdf8);
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        margin-left: 10px;
    }

    button:hover {
        transform: scale(1.05);
    }

    .editor-container {
        display: flex;
        height: 60vh;
    }

    #inputEditor, #outputEditor {
        width: 50%;
        height: 100%;
    }

    .bottom {
        padding: 15px;
    }

    textarea {
        width: 100%;
        background: #020617;
        color: #38bdf8;
        border: none;
        padding: 10px;
        border-radius: 5px;
    }

    #console {
        background: black;
        color: #00ff00;
        padding: 10px;
        height: 150px;
        overflow-y: auto;
    }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>

<body>

<h1>Code Transpiler IDE</h1>

<div class="top-bar">

    <select id="lang">
        <option value="cpp">C++</option>
        <option value="java">Java</option>
        <option value="js">JavaScript</option>
    </select>

    <div>
        <button onclick="uploadFile()">📁 Upload</button>
        <button onclick="submitCode()">⚡ Convert</button>
        <button onclick="runCode()">▶ Run</button>
        <button onclick="downloadCode()">⬇ Download</button>
    </div>

</div>

<input type="file" id="fileInput" style="display:none" accept=".py">

<div class="editor-container">
    <div id="inputEditor"></div>
    <div id="outputEditor"></div>
</div>

<div class="bottom">
    <h3>Input</h3>
    <textarea id="inputBox"></textarea>

    <h3>Console</h3>
    <div id="console"></div>
</div>

<script>
let inputEditor, outputEditor;

require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" }});

require(["vs/editor/editor.main"], function () {

    inputEditor = monaco.editor.create(document.getElementById("inputEditor"), {
        value: "// Write Python code here",
        language: "python",
        theme: "vs-dark"
    });

    outputEditor = monaco.editor.create(document.getElementById("outputEditor"), {
        value: "",
        language: "cpp",
        theme: "vs-dark",
        readOnly: true
    });
});

function submitCode() {
    const code = inputEditor.getValue();
    const language = document.getElementById("lang").value;

    fetch("/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-Requested-With": "XMLHttpRequest"
        },
        body: `code=${encodeURIComponent(code)}&language=${language}`
    })
    .then(res => res.json())
    .then(data => {
        outputEditor.setValue(data.output);

        const map = {
            cpp: "cpp",
            java: "java",
            js: "javascript"
        };

        monaco.editor.setModelLanguage(outputEditor.getModel(), map[language]);
    });
}

function runCode() {
    const code = outputEditor.getValue();
    const language = document.getElementById("lang").value;
    const input = document.getElementById("inputBox").value;

    fetch("/run", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: `code=${encodeURIComponent(code)}&language=${language}&input=${encodeURIComponent(input)}`
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("console").innerText = data;
    });
}

function uploadFile() {
    document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        inputEditor.setValue(e.target.result);
    };

    reader.readAsText(file);
});

function downloadCode() {
    const code = outputEditor.getValue();
    const lang = document.getElementById("lang").value;

    let filename = "output.txt";

    if (lang === "cpp") filename = "output.cpp";
    else if (lang === "java") filename = "Main.java";
    else if (lang === "js") filename = "script.js";

    const blob = new Blob([code], { type: "text/plain" });
    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}
</script>

</body>
</html>
